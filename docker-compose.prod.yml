version: '3.9'

include:
  - ./docker/monitoring/docker-compose.monitoring.yml

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=erp
      - DATABASE_PASSWORD=erp123
      - DATABASE_NAME=erpdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - erp-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=https://your-server.com/api
    ports:
      - "3001:3001"
    command: ["npm", "start", "--", "-p", "3001"]
    depends_on:
      - backend
    restart: always
    networks:
      - erp-net

  nginx:
    build:
      context: ./docker
      dockerfile: nginx/Dockerfile
    ports:
      - "443:443"
    depends_on:
      - postgres
      - backend
      - frontend
      - grafana
    restart: always
    networks:
      - erp-net

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp123
      POSTGRES_DB: erpdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    networks:
      - erp-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: always
    networks:
      - erp-net

networks:
  erp-net:
    name: erp-net

volumes:
  postgres-data:
  redis-data:
