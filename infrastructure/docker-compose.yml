version: "3.9"

networks:
  gifi-net:

volumes:
  postgres_data:

services:

  db:
    image: postgres:16
    container_name: gifi-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gifi_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gifi-net

  adminer:
    image: adminer
    container_name: gifi-adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - gifi-net

  redis:
    image: redis:alpine
    container_name: gifi-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - gifi-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gifi-backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
    networks:
      - gifi-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gifi-frontend
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "5173:80"
    networks:
      - gifi-net
